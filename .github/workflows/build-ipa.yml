name: Build SECURE AI iPad IPA

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

jobs:
  build-ipa:
    runs-on: macos-26
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Show Xcode Version
        run: xcodebuild -version

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode Project
        run: xcodegen generate

      - name: Build Unsigned Release App for iPadOS 26 (arm64)
        run: |
          xcodebuild \
            -project SECURE_AI_iPad.xcodeproj \
            -scheme SECURE_AI_iPad \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build

      - name: Verify Native iPadOS Info.plist Keys
        run: |
          plutil -p build/Build/Products/Release-iphoneos/SECURE_AI_iPad.app/Info.plist
          plutil -p build/Build/Products/Release-iphoneos/SECURE_AI_iPad.app/Info.plist | grep -q "UILaunchScreen"
          plutil -p build/Build/Products/Release-iphoneos/SECURE_AI_iPad.app/Info.plist | grep -q "CADisableMinimumFrameDurationOnPhone"

      - name: Package .ipa
        run: |
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/SECURE_AI_iPad.app Payload/
          zip -r SECURE_AI_iPad_v3.0.10.ipa Payload
          ls -lh SECURE_AI_iPad_v3.0.10.ipa

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: SECURE_AI_iPad_v3.0.10_IPA
          path: SECURE_AI_iPad_v3.0.10.ipa
          retention-days: 30
